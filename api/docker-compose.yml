networks:
  gymmanagement:

services:
    
  gymmanagement_db:
    container_name: app-db
    image: mcr.microsoft.com/mssql/server:2019-latest
    
    ports:
    - 1433:1433
    environment:
    - ACCEPT_EULA=Y
    - SA_PASSWORD=YourStrong!Passw0rd
    networks:
    - gymmanagement
 

  gymmanagement_api:
    container_name: gym-api-container
    image: ${DOCKER_REGISTRY-}gymmanagementapi
    build:
      context: GymManagement_API
      dockerfile: Dockerfile
    ports:
       - 8080:8080
       - 8081:8081
    depends_on:
      - gymmanagement_db
    environment:
      - DB_HOST=localhost,1433
      - DB_NAME=gym
      - DB_SA_PASSWORD=Manhvl231@
        
    networks:
      - gymmanagement